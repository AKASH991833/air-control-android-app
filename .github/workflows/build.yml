name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Download gesture model
        run: curl -fsSL -o app/src/main/assets/gesture_recognizer.task https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/latest/gesture_recognizer.task
      - run: gradle assembleDebug --no-daemon
      - name: Build previous version (0.1.0) for upgrade test, same debug key
        run: |
          git worktree add ../old c6e6968
          cp app/src/main/assets/gesture_recognizer.task ../old/app/src/main/assets/
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/new.apk
          (cd ../old && gradle assembleDebug --no-daemon && cp app/build/outputs/apk/debug/app-debug.apk /tmp/old.apk)
          mkdir -p apkout && cp /tmp/new.apk apkout/app-debug.apk && cp /tmp/old.apk apkout/old-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: AirControl-debug-apk, path: apkout }

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: AirControl-debug-apk, path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene -camera-front emulated
          script: bash scripts/emulator_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: emulator-results, path: out }
