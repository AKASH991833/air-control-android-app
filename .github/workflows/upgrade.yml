name: Signed upgrade test
on:
  push:
    branches: [upgrade-test]
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the published signed 0.1.0
        run: mkdir -p apk && curl -fsSL -o apk/old.apk https://github.com/AKASH991833/air-control-android-app/releases/download/v0.1.0/AirControl-0.1.0.apk && sha256sum apk/old.apk tests/prod/AirControl-0.1.1.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/upgrade_signed.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: upgrade-results, path: out }
